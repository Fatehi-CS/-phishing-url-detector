<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing URL Detector</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h1 { font-size: 24px; margin-bottom: 10px; color: #38bdf8; }
        p.subtitle { font-size: 14px; color: #94a3b8; margin-bottom: 25px; }
        input[type="url"] {
            width: 90%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: white;
            font-size: 16px;
            margin-bottom: 15px;
        }
        button {
            width: 96%;
            padding: 14px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #0369a1; }
        .result-box {
            margin-top: 25px;
            padding: 18px;
            border-radius: 10px;
            font-weight: bold;
            line-height: 1.6;
        }
        .safe { background-color: #065f46; border: 2px solid #10b981; color: #ecfdf5; }
        .danger { background-color: #7f1d1d; border: 2px solid #ef4444; color: #fef2f2; }
        .unknown { background-color: #374151; border: 2px solid #9ca3af; color: #f3f4f6; }
        .warnings-box {
            margin-top: 15px;
            background-color: #0f172a;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            font-size: 14px;
            border-left: 4px solid #f59e0b;
        }
        .warnings-box ul { margin: 8px 0 0 0; padding-left: 20px; color: #cbd5e1; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🛡️ Phishing URL Detector</h1>
        <p class="subtitle">Analyze suspicious links before clicking to protect against phishing attacks</p>
        
        <form method="POST">
            <input type="url" name="url" placeholder="https://example.com" required value="{{ result.url if result else '' }}">
            <button type="submit">Scan URL</button>
        </form>

        {% if result %}
            <div class="result-box {{ result.status }}">
                {{ result.message }}
            </div>

            {% if result.warnings %}
                <div class="warnings-box">
                    <strong>⚠️ Heuristic Analysis Warnings:</strong>
                    <ul>
                        {% for warning in result.warnings %}
                            <li>{{ warning }}</li>
                        {% endfor %}
                    </ul>
                </div>
            {% endif %}
        {% endif %}
    </div>
</body>
</html>
